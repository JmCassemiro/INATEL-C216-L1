name: CI - Frontend

# O E2E roda a stack completa (frontend + API + PostgreSQL), entao mudancas no backend,
# no Compose ou no Makefile tambem disparam este workflow.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "compose.yaml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Run Unit and Integration Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # Sobe db + api + frontend numa stack isolada (Docker Compose), roda o
      # Playwright contra ela e derruba tudo no final.
      - name: Run Full-stack E2E Tests
        working-directory: .
        run: make e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
